<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linda (preview) | Zarix AI</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060b18">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<base href="/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=20261126c">
<style>
.lc{margin-top:28px;max-width:720px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel-solid);display:flex;flex-direction:column;height:min(70vh,640px)}
.lc-head{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center}
.lc-head strong{font-family:var(--f-display,inherit)}
.lc-head span{color:var(--muted);font-size:.85rem}
.lc-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.lc-m{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;font-size:1rem}
.lc-m.bot{background:rgba(255,255,255,.06);align-self:flex-start;border-top-left-radius:4px}
.lc-m.me{background:rgba(207,174,102,.18);align-self:flex-end;border-top-right-radius:4px}
.lc-m.wait{color:var(--muted);font-style:italic}
.lc-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line-2)}
.lc-in textarea{flex:1;resize:none;font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;height:48px}
.lc-in textarea:focus{border-color:var(--gold);outline:none}
.lc-foot{padding:0 18px 12px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main id="main">
<section class="wrap page-hero">
<a class="brand" href="index.html" aria-label="Zarix AI home"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true" focusable="false"><path d="M5 6h16L5 20h16" fill="none" stroke="#cfae66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="6" r="2.3" fill="#53c6e0"/><circle cx="21" cy="20" r="2.3" fill="#ecd49a"/></svg>ZARIX<small>AI</small></a>
<p class="eyebrow" style="margin-top:28px">Preview, not public</p>
<h1 style="margin-top:12px">Linda v2 test page</h1>
<div class="lc">
  <div class="lc-head"><strong>Linda</strong><span>Zarix AI's virtual assistant (AI)</span></div>
  <div class="lc-log" id="lc-log" aria-live="polite"></div>
  <form class="lc-in" id="lc-form"><label for="lc-text" style="position:absolute;left:-9999px">Your message</label><textarea id="lc-text" maxlength="1500" placeholder="Ask about Zarix AI or book a mini assessment"></textarea><button class="btn btn-gold" type="submit" id="lc-send">Send</button></form>
  <p class="lc-foot">Linda is an AI and can make mistakes. Please don't share health, patient, customer or employee personal information. <a href="privacy.html">Privacy</a></p>
</div>
</section>
</main>
<script>
(function () {
  var ENDPOINT = "PASTE_LINDA_URL_HERE";
  var GREETING = "Hi, I'm Linda, Zarix AI's virtual assistant. I'm an AI, here to answer questions about Zarix AI and help you book a free mini assessment. What would you like to know?";
  var log = document.getElementById("lc-log"), form = document.getElementById("lc-form"), box = document.getElementById("lc-text"), btn = document.getElementById("lc-send");
  var history = [], busy = false;
  function add(role, text, extra) { var d = document.createElement("div"); d.className = "lc-m " + (role === "user" ? "me" : "bot") + (extra ? " " + extra : ""); d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
  add("assistant", GREETING);
  function send(text) {
    if (busy || !text.trim()) return;
    busy = true; btn.disabled = true;
    add("user", text); history.push({ role: "user", content: text });
    var w = add("assistant", "Linda is typing…", "wait");
    fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ messages: history }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { w.remove(); var reply = d.reply || "Sorry, something went wrong. Please write to inquiries@zarix.ai."; add("assistant", reply); if (d.ok && d.reply) history.push({ role: "assistant", content: reply }); else history.pop(); })
      .catch(function () { w.remove(); add("assistant", "Sorry, I can't connect just now. You can book at zarix.ai/contact or write to inquiries@zarix.ai."); history.pop(); })
      .then(function () { busy = false; btn.disabled = false; box.focus(); });
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); var t = box.value; box.value = ""; send(t); });
  box.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
})();
</script>
</body>
</html>
